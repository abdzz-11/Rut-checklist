<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RUT Check">
<meta name="theme-color" content="#0a0f13">
<title>A330 Run Up & Taxi Checklist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
/* VOICE: clinical, calm, cockpit — an app used on shift, one thumb, fast.
   IDEA: an iPhone app built like an ECAM/QRH card: home launcher of procedure icons, one checklist per screen.
   PICTURE: the launcher grid of icons with progress rings; inside, the live checklist plus an icon dock.
   COLOUR and TYPE: ECAM colours (green done, cyan values, amber caution, red emergency); B612, Airbus's cockpit face.
   LAYOUT: app shell — sticky top bar, scrolling body, bottom dock + action bar, safe-area aware; centred column on wide screens. */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f0,#05080b);--card:light-dark(#ffffff,#111a20);--bar:light-dark(rgba(246,248,247,.86),rgba(10,15,19,.86));
--ink:light-dark(#10181d,#e8eef0);--mute:light-dark(#56666e,#8c9ca3);--line:light-dark(#d3dbd9,#22313a);
--cy:light-dark(#00708f,#3fd3f5);--gr:light-dark(#0b7a43,#2fe08a);--am:light-dark(#9a5a00,#ffb020);--rd:light-dark(#c1272d,#ff5a5f);
--amb:light-dark(#fff4dc,#2a1f08);--rdb:light-dark(#fde8e8,#2a0e10);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "B612",-apple-system,system-ui,sans-serif;overflow-x:clip;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{max-width:720px;margin:0 auto;min-height:100dvh}
.tb{position:sticky;top:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid var(--line);padding:calc(var(--st) + 8px) calc(var(--sr) + 16px) 10px calc(var(--sl) + 16px)}
.tbr{display:flex;align-items:center;gap:8px;min-height:44px}
.back{display:flex;align-items:center;gap:2px;color:var(--cy);font-size:17px;min-height:44px;padding-right:8px}
.back svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none}
.tbt{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbp{font:700 15px "B612 Mono",monospace;color:var(--gr);min-width:56px;text-align:right}
.big{font-size:34px;line-height:1.08;font-weight:700;margin:6px 0 10px}
.sub0{font-size:13px;color:var(--mute);margin-top:-6px;margin-bottom:10px}
.srch{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:12px;padding:0 12px;min-height:44px}
.srch svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.srch input{flex:1;font:16px "B612",sans-serif;border:0;background:none;color:var(--ink);min-height:44px;outline:none;-webkit-user-select:text;user-select:text}
.wrap{padding:6px calc(var(--sr) + 16px) calc(var(--sb) + 40px) calc(var(--sl) + 16px)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px;font-size:14px;color:var(--mute)}
.gh.em{color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;position:relative}
.tile .ap{width:68px;height:68px;border-radius:18px;background:var(--card);border:.5px solid var(--line);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.35);transition:transform .15s}
.tile:active .ap{transform:scale(.92)}
.tile.em .ap{background:var(--rdb);border-color:color-mix(in srgb,var(--rd) 40%,transparent)}
.tile svg{width:52px;height:52px}
.tile span{font-size:11.5px;line-height:1.25;text-align:center;max-width:96px}
.tile i{position:absolute;top:0;right:calc(50% - 40px);min-width:22px;height:22px;border-radius:11px;background:var(--gr);color:var(--card);font:700 11px/22px "B612 Mono",monospace;text-align:center;font-style:normal;padding:0 5px;display:none}
.tile.done i{display:block}
.tile.dim{opacity:.22}
.g{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.em .g{stroke:var(--rd)}
.done .g{stroke:var(--gr)}
.ring{fill:none;stroke-width:2.5;stroke:var(--gr);transform:rotate(-90deg);transform-origin:20px 20px;transition:stroke-dashoffset .3s}
.ring-bg{fill:none;stroke:var(--line);stroke-width:2.5}
.sum{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.sum b{font:700 24px "B612 Mono",monospace;color:var(--gr)}
.sum small{display:block;color:var(--mute);font-size:13px}
.lnk{color:var(--cy);font-size:15px;min-height:44px;padding:0 4px}
.hint{font-size:13px;color:var(--mute);margin:26px 4px 0;line-height:1.5}
/* procedure view */
.hd{padding:2px 0 8px}
.kind{font-size:13px;color:var(--mute)}
.kind.em{color:var(--rd)}
.pv h1{font-size:28px;line-height:1.1;margin:2px 0 10px;text-wrap:balance}
.barp{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.barp i{display:block;height:100%;background:var(--gr);transition:width .3s}
.list{background:var(--card);border:.5px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}
.list.em{border-color:color-mix(in srgb,var(--rd) 45%,transparent)}
ol{list-style:none;margin:0;padding:4px 0}
.st{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 12px;padding:12px 16px;border-top:.5px solid var(--line);border-left:3px solid transparent}
.st:first-child{border-top:0}
.st:active{background:color-mix(in srgb,var(--cy) 10%,transparent)}
.st.cur{border-left-color:var(--cy)}
.box{width:28px;height:28px;border:2px solid var(--mute);border-radius:8px;display:grid;place-items:center;transition:background .15s}
.box svg{width:16px;height:16px;stroke:var(--card);stroke-width:3;fill:none;opacity:0}
.st.ok .box{background:var(--gr);border-color:var(--gr)}.st.ok .box svg{opacity:1}
.ln{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.k{font-weight:700;font-size:15.5px}
.dots{flex:1 1 24px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.v{font:700 15px "B612 Mono",monospace;color:var(--cy);margin-left:auto;text-align:right}
.st.ok .k{color:var(--mute)}.st.ok .v{color:var(--gr)}
.sub{grid-column:2;margin:5px 0 0;padding:0;list-style:none;color:var(--mute);font-size:14.5px}
.sub li{padding-left:14px;position:relative}
.sub li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.seq{grid-column:2;margin-top:8px;border:.5px solid var(--line);border-radius:10px;font-size:14px;overflow:hidden}
.seq div{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px;padding:6px 10px;border-top:.5px solid var(--line)}
.seq div:first-child{border-top:0}
.seq em{font-style:normal;color:var(--mute)}
.seq span{color:var(--cy);font-weight:700}
.msg{margin:10px 12px;padding:10px 12px;border-radius:12px;font-size:14.5px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.msg b{margin-right:6px}
.msg.c{background:var(--amb)}.msg.c b{color:var(--am)}
.msg.w{background:var(--rdb)}.msg.w b{color:var(--rd)}
.sh{padding:14px 16px 2px;font-size:14px;font-weight:700;color:var(--am);border-top:.5px solid var(--line)}
.end{padding:16px;text-align:center;font-weight:700;font-size:14px;color:var(--mute);border-top:.5px solid var(--line)}
.end.ok{color:var(--gr)}
.jump{display:grid;gap:8px;margin-top:14px}
.pill{min-height:48px;border-radius:12px;background:var(--card);border:.5px solid var(--line);padding:10px 14px;text-align:left;color:var(--cy);font-weight:700}
.tools{display:flex;gap:16px;justify-content:center;margin-top:18px}
.tools .lnk{color:var(--mute)}
/* bottom bar */
.bb{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:.5px solid var(--line);padding:0 0 var(--sb)}
.bbi{max-width:720px;margin:0 auto}
.dock{display:flex;gap:2px;overflow-x:auto;padding:6px calc(var(--sr) + 8px) 2px calc(var(--sl) + 8px);scroll-snap-type:x proximity;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;scroll-snap-align:center;position:relative}
.dk svg{width:36px;height:36px}
.dk span{font:700 10px "B612 Mono",monospace;color:var(--mute)}
.dk.on{background:color-mix(in srgb,var(--cy) 14%,transparent)}
.dk.on span{color:var(--cy)}
.sep{flex:none;width:1px;margin:8px 4px;background:var(--rd);opacity:.5}
.act{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;padding:6px calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px)}
.ab{min-height:50px;border-radius:14px;display:grid;place-items:center}
.ab svg{width:24px;height:24px;stroke:var(--cy);stroke-width:2.4;fill:none}
.ab:disabled svg{stroke:var(--line)}
.tick{background:var(--cy);color:var(--card);font-weight:700;font-size:16px}
.tick.fin{background:var(--gr)}
.pv .wrap{padding-bottom:calc(var(--sb) + 150px)}
.slide{animation:in .22s ease-out}
.slide.l{animation-name:inl}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
@keyframes inl{from{opacity:0;transform:translateX(-24px)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--gr);color:var(--card);font-weight:700;padding:10px 18px;border-radius:22px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

const IC={

plug:'<path d="M16 9v5M24 9v5M13 14h14v4a7 7 0 0 1-14 0zM20 25v6"/>',
apuplug:'<rect x="10" y="13" width="14" height="12" rx="2"/><path d="M14 19h6M24 17h5M24 21h5"/><path d="M14 13v-3M20 13v-3"/>',
battery:'<rect x="10" y="13" width="18" height="13" rx="2"/><path d="M14 13v-2h3v2M21 13v-2h3v2M14 19.5h4M22 17.5v4M20 19.5h4"/>',
panel:'<rect x="9" y="10" width="22" height="20" rx="2"/><circle cx="15" cy="17" r="3"/><circle cx="25" cy="17" r="3"/><path d="M15 17l1.5-1.5M25 17l-1 2M12 25h16"/>',

apufire:'<rect x="9" y="15" width="12" height="11" rx="2"/><path d="M27 12c.5 2 4 3.5 4 7a4 4 0 0 1-8 0c0-2 1.5-3 2-4 .5 1.5 1.5 2 1.5 2 0-2 .3-3.5.5-5z"/>',

smoke:'<path d="M12 28h16M14 24c-2-2 0-4 2-4 0-3 4-4 5-2 2-2 6 0 5 3 2 0 3 2 2 3"/><path d="M16 16c0-2 2-2 2-4M22 15c0-2 2-2 2-4"/>'
};

let st={};try{st=JSON.parse(localStorage.getItem("rut-cf6-ck")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("rut-cf6-ck",JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
for(const p of P){const B=[];let last=null,n=0;
 for(const l of p.L){
  if(l.startsWith("- ")){if(last)(last.sub||(last.sub=[])).push(l.slice(2));else B.push({t:"N",x:l.slice(2)})}
  else if(l.startsWith("= ")){const[a,b]=l.slice(2).split("|");if(last)(last.seq||(last.seq=[])).push([a,b])}
  else if(/^[CN#] /.test(l))B.push({t:l[0],x:l.slice(2)});
  else{const[k,v]=l.split("|");last={t:"S",k,v,i:n++};B.push(last)}}
 p.B=B;p.total=n;p.txt=(p.L.join(" ")+" "+p.n).toLowerCase()}
const app=document.getElementById("app"),toastEl=document.getElementById("toast");
const done=p=>(st[p.id]||[]).length,full=p=>done(p)===p.total;
const ring=p=>{const c=2*Math.PI*18,f=p.total?done(p)/p.total:0;return `<circle class="ring-bg" cx="20" cy="20" r="18"/><circle class="ring" cx="20" cy="20" r="18" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-f)).toFixed(2)}"/>`};
const icon=p=>`<svg viewBox="0 0 40 40" aria-hidden="true">${ring(p)}<g class="g">${IC[p.ic]}</g></svg>`;
const CHEV='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',CHEVR='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const standalone=!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches);
let cur=-1,focus=-1,query="",dir=0,bb=null;
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("show"),1400)}
function home(){
 const tot=P.reduce((a,p)=>a+p.total,0),dn=P.reduce((a,p)=>a+done(p),0),cmp=P.filter(full).length;
 const tiles=em=>P.map((p,i)=>!!p.em===em?`<button class="tile${p.em?" em":""}${full(p)?" done":""}" data-i="${i}" data-q="${i}"><span class="ap">${icon(p)}</span><i>✓</i><span>${esc(p.s)}</span></button>`:"").join("");
 app.innerHTML=`<header class="tb"><div class="big">RUT Checklist</div><div class="sub0">A330 GE CF6-80E1 · Engine Run Up Course (G0370T0)</div>
 <label class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Find a step: HPSOV, X BLEED, oil…" value="${esc(query)}" enterkeyhint="go" autocomplete="off"></label></header>
 <div class="wrap">
 <div class="sum"><div><b>${cmp}/${P.length}</b><small>procedures completed · ${dn} of ${tot} steps ticked</small></div><button class="lnk" id="ra">Reset all</button></div>
 <div class="gh"><span>Normal procedures</span><span>${P.filter(p=>!p.em).length}</span></div><div class="grid">${tiles(false)}</div>
 <div class="gh em"><span>Emergency procedures</span><span>${P.filter(p=>p.em).length}</span></div><div class="grid">${tiles(true)}</div>
 ${standalone?`<p class="hint">Works offline. Ticks are kept on this device only. Source is an Airbus training document (Jul 2003) — not for reference.</p>`:`<p class="hint">Install: open in Safari, tap Share, then “Add to Home Screen”. After the first open it works without internet. Source is an Airbus training document (Jul 2003) — not for reference.</p>`}</div>`;
 if(bb){bb.remove();bb=null}
 const q=document.getElementById("q");q.addEventListener("input",()=>{query=q.value;filter()});
 q.addEventListener("keydown",e=>{if(e.key==="Enter"){const t=query.trim().toLowerCase(),k=P.findIndex(p=>p.txt.includes(t));if(t&&k>=0)open(k)}});
 const ra=document.getElementById("ra");ra.onclick=()=>{if(ra.dataset.s){st={};save();home();toast("All checklists reset")}else{ra.dataset.s=1;ra.textContent="Tap again";setTimeout(()=>{if(ra.isConnected){delete ra.dataset.s;ra.textContent="Reset all"}},2500)}};
 filter()}
function filter(){const t=query.trim().toLowerCase();app.querySelectorAll(".tile").forEach(b=>b.classList.toggle("dim",!!t&&!P[b.dataset.i].txt.includes(t)))}
function proc(){
 const p=P[cur],ck=new Set(st[p.id]||[]),d=ck.size,pc=Math.round(d/p.total*100);
 let L="";
 for(const b of p.B){
  if(b.t==="S"){L+=`<li class="st${ck.has(b.i)?" ok":""}${b.i===focus?" cur":""}" data-s="${b.i}" role="checkbox" aria-checked="${ck.has(b.i)}"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><div><div class="ln"><span class="k">${esc(b.k)}</span><span class="dots"></span><span class="v">${esc(b.v)}</span></div></div>`;
   if(b.sub)L+=`<ul class="sub">${b.sub.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
   if(b.seq)L+=`<div class="seq">${b.seq.map(([a,v])=>`<div><em>${esc(a)}</em><span>${esc(v)}</span></div>`).join("")}</div>`;
   L+=`</li>`}
  else if(b.t==="#")L+=`<li class="sh">${esc(b.x)}</li>`;
  else L+=`<li class="msg ${b.t==="C"?(p.em?"w":"c"):""}"><b>${b.t==="C"?"CAUTION":"NOTE"}</b>${esc(b.x)}</li>`}
 app.innerHTML=`<div class="pv"><header class="tb"><div class="tbr"><button class="back" id="bk">${CHEV}All</button><div class="tbt">${esc(p.s)}</div><div class="tbp">${pc}%</div></div></header>
 <div class="wrap slide${dir<0?" l":""}" id="body"><div class="hd"><div class="kind${p.em?" em":""}">${p.em?"Emergency":"Normal"} · ${cur+1} of ${P.length} · Checklist page ${p.pg}</div><h1>${esc(p.n)}</h1><div class="barp"><i style="width:${pc}%"></i></div></div>
 <div class="list${p.em?" em":""}"><ol>${L}</ol><div class="end${d===p.total?" ok":""}">${esc(p.n.toUpperCase())} CHECKLIST ${d===p.total?"COMPLETED ✓":"· "+(p.total-d)+" left"}</div></div>
 ${p.go?`<div class="jump">${p.go.map(([id,t])=>`<button class="pill" data-go="${id}">${esc(t)} →</button>`).join("")}</div>`:""}
 <div class="tools"><button class="lnk" id="rs">Reset this checklist</button></div></div></div>`;
 if(!bb){bb=document.createElement("nav");bb.className="bb";document.body.appendChild(bb)}
 bb.innerHTML=`<div class="bbi"><div class="dock" id="dock">${P.map((q,i)=>(q.em&&!P[i-1].em?'<span class="sep"></span>':"")+`<button class="dk${q.em?" em":""}${full(q)?" done":""}${i===cur?" on":""}" data-i="${i}" aria-label="${esc(q.n)}">${icon(q)}<span>${i+1}</span></button>`).join("")}</div>
 <div class="act"><button class="ab" id="pv" ${cur?"":"disabled"} aria-label="Previous procedure">${CHEV}</button><button class="ab tick${d===p.total?" fin":""}" id="nx">${d===p.total?"Completed ✓ · Next":"Tick next step"}</button><button class="ab" id="nt" ${cur<P.length-1?"":"disabled"} aria-label="Next procedure">${CHEVR}</button></div></div>`;
 const on=bb.querySelector(".dk.on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
 document.getElementById("bk").onclick=()=>nav("home");
 document.getElementById("rs").onclick=()=>{delete st[p.id];focus=-1;save();dir=0;proc();toast("Checklist reset")};
 document.getElementById("pv").onclick=()=>step(-1);document.getElementById("nt").onclick=()=>step(1);
 document.getElementById("nx").onclick=()=>{if(d===p.total){if(cur<P.length-1)step(1);return}const nxt=p.B.find(b=>b.t==="S"&&!ck.has(b.i));if(nxt)toggle(nxt.i,true)};
 bb.querySelector("#dock").onclick=e=>{const b=e.target.closest("[data-i]");if(b){dir=+b.dataset.i>cur?1:-1;nav(P[+b.dataset.i].id)}}}
function toggle(i,on){const p=P[cur],s=new Set(st[p.id]||[]);const add=on??!s.has(i);add?s.add(i):s.delete(i);st[p.id]=[...s];focus=i;save();
 const y=window.scrollY;dir=0;proc();app.querySelector("#body").classList.remove("slide");window.scrollTo(0,y);
 if(add&&s.size===p.total)toast("Checklist completed ✓");
 else if(on){const el=app.querySelector(`[data-s="${i+1}"]`);if(el){const r=el.getBoundingClientRect();if(r.bottom>innerHeight-160)window.scrollBy({top:r.bottom-innerHeight+200,behavior:"smooth"})}}}
function step(k){const n=cur+k;if(n<0||n>=P.length)return;dir=k;nav(P[n].id)}
function open(i){dir=1;nav(P[i].id)}
function nav(id){if(location.hash.slice(1)===id)route();else location.hash=id}
function route(){const id=location.hash.slice(1),i=P.findIndex(p=>p.id===id);
 if(i<0){cur=-1;home();window.scrollTo(0,0);return}
 if(i!==cur){focus=-1;cur=i;proc();window.scrollTo(0,0)}else proc()}
app.addEventListener("click",e=>{const s=e.target.closest("[data-s]");if(s)return toggle(+s.dataset.s);
 const t=e.target.closest(".tile");if(t)return open(+t.dataset.i);
 const g=e.target.closest("[data-go]");if(g){dir=1;nav(g.dataset.go)}});
/* swipe between procedures */
let sx=0,sy=0,stt=0;
app.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;stt=Date.now()},{passive:true});
app.addEventListener("touchend",e=>{if(cur<0)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-stt<600&&sx>24)step(dx<0?1:-1)},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||cur<0||e.metaKey||e.ctrlKey||e.altKey)return;const p=P[cur];
 if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);else if(e.key==="Escape")nav("home");
 else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();focus=Math.max(0,Math.min(p.total-1,focus+(e.key==="ArrowDown"?1:-1)));dir=0;proc();const el=app.querySelector(`[data-s="${focus}"]`);if(el)el.scrollIntoView({block:"center"})}
 else if(e.key===" "&&focus>=0){e.preventDefault();toggle(focus)}});
window.addEventListener("hashchange",route);route();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
